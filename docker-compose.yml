services:
  postgres:
    image: postgres:16
    container_name: logi_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: logistics
    ports:
      - "5434:5432"
    volumes:
      - logi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d logistics"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: logi_redis
    ports:
      - "6380:6379"

  mongo:
    image: mongo:7
    container_name: logi_mongo
    ports:
      - "27018:27017"
    volumes:
      - logi_mongodata:/data/db

volumes:
  logi_pgdata:
  logi_mongodata: